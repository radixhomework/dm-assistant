services:
  app:
    build:
      context: .
      args:
        VITE_UI_LOCALE: ${UI_LOCALE:-en}
    environment:
      PORT: 3000
      DATABASE_URL: postgres://dm:dm@postgres:5432/dm_assistant
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
      POSTGRES_DB: dm_assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dm_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
