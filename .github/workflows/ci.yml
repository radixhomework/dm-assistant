name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: dm
          POSTGRES_DB: dm_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dm -d dm_assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dm:dm@localhost:5432/dm_assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate -w app
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.GH_SONAR_TOKEN }}
      - name: SonarQube quality gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.GH_SONAR_TOKEN }}
