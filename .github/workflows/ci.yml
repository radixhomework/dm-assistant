name: CI

on:
  # Feature branches run the same pipeline: the PR gate polls these
  # runs, and a push-only-main trigger would leave the branch checks
  # empty until the PR opens on main.
  push:
    branches: ["**"]
  pull_request:

# Least privilege (CodeQL actions/missing-workflow-permissions): the
# pipeline only reads the repository — no token write anywhere.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: dm
          POSTGRES_DB: dm_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dm -d dm_assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dm:dm@localhost:5432/dm_assistant
      # The builds and tsc on this monorepo outgrew the default heap on
      # the hosted runner.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Mirror the build output into the step summary: the job log is
      # not readable without a token, the summary is.
      - name: Build
        run: |
          npm run build 2>&1 | tee /tmp/build.out
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            printf '::error::Build failed (exit %s). See the step summary for full output.\n' "$EXIT"
          fi
          cat /tmp/build.out > "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit "$EXIT"
      - run: npm run db:migrate -w app
      - run: npm run lint
      # Surface tsc errors in the step summary: the job log itself is
      # not readable without a token, the summary is.
      - name: Typecheck
        run: |
          npm run typecheck 2>&1 | tee /tmp/tc.out
          EXIT=${PIPESTATUS[0]}
          grep -E "error TS" /tmp/tc.out | sed 's/^/::error ::/' || true
          tail -40 /tmp/tc.out > "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          exit $EXIT
      - run: npm run test
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.GH_SONAR_TOKEN }}
      - name: SonarQube quality gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.GH_SONAR_TOKEN }}
