# SonarCloud — org radixhomework (project key convention: radixhomework_<repo>)
sonar.projectKey=radixhomework_dm-assistant
sonar.organization=radixhomework
sonar.projectName=dm-assistant

sonar.sources=app/src,app-web/src,packages/schemas/src
sonar.tests=app-web/src,packages/schemas/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=app/drizzle/**

sonar.javascript.lcov.reportPaths=app/coverage/lcov.info,app-web/coverage/lcov.info,packages/schemas/coverage/lcov.info
sonar.coverage.exclusions=app/src/main.ts,app/src/database/migrate.ts,app/src/database/schema.ts,app/src/**/*.module.ts,app/src/testing/**,app-web/src/main.tsx,app-web/src/testing/**
